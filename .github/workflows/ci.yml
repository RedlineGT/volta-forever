name: ci

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  check:
    # Build the installer test binaries on the oldest distribution in the matrix.
    runs-on: ubuntu-22.04
    steps:
      # (Each action is pinned to the commit of the tag or branch that its comment names.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: The layer built as scripts/build.sh installs it
        run: scripts/build.sh
      - name: The proxy against a stand-in for the driver
        run: |
          tests/proxy/fit_api.sh
          tests/proxy/marker.sh
          tests/proxy/graph_fit.sh
          tests/proxy/lifecycle.sh
          python3 tests/proxy/library_entries.py dist/lib/libcuda.so.1
          python3 tests/proxy/readonly_tables.py dist/lib/libcuda.so.1
          python3 tests/proxy/driver_capability.py dist/lib/libcuda.so.1
          python3 tests/proxy/link_refusals.py dist/lib/libcuda.so.1
          python3 tests/proxy/nccl_remedy.py dist/lib/libcuda.so.1
          python3 tests/proxy/launch_guard.py dist/lib/libcuda.so.1
          tests/proxy/guard_stress.sh
          python3 tests/proxy/jitlink_fork.py dist/lib/libnvJitLink.so.13
      - name: The audit library's answer to NVML, against a stand-in
        run: python3 tests/proxy/nvml_capability.py dist/lib/libvf_audit.so
      - name: The stack handling of the forwarding libraries, against a mock library
        run: tests/forward/stack.sh
      - name: The bf16 cuBLAS variants and their runtime, against stand-ins for the driver and cuBLAS
        run: tests/forward/bf16.sh
      - name: The launcher, under dash and under bash
        run: |
          dash tests/launcher/launcher.sh
          bash --posix tests/launcher/launcher.sh
      - name: How the PyTorch test programs run their workers, with fake workers
        run: python3 tests/gpu/torch-workers.py
      - name: The verdicts of the vLLM engine stage, with a stand-in for vLLM
        run: python3 tests/gpu/vllm-engine-verdicts.py
      - name: The installer is a POSIX shell script
        run: |
          dash -n install.sh
          bash --posix -n install.sh
      - name: The installer and the downloader, on local releases and archives
        run: |
          python3 tests/launcher/install.py
          VF_TEST_SHELL=bash python3 tests/launcher/install.py
          python3 tests/launcher/fetch-redist.py
      - name: The Rust translator against the Python reference, on the test kernels
        run: |
          scripts/fetch-all.sh denvdis
          VF_TOOL=dist/bin/vf-translate JOBS=4 tests/sass/compare.sh

      - name: Prepare the installer test archive from this build
        if: github.event_name != 'release'
        run: tests/launcher/installer-fixture.sh "$RUNNER_TEMP/installer-fixture"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (v7.0.2)
        if: github.event_name != 'release'
        with:
          name: installer-fixture
          path: ${{ runner.temp }}/installer-fixture/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  install:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - name: What a user has before the one-liner
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (v8.0.2)
        if: github.event_name != 'release'
        with:
          name: installer-fixture
          path: installer-fixture
      - name: Install and run the installed binaries
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
              test "$GITHUB_REF_NAME" = "v$version"
              export VF_INSTALL_BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          else
              export VF_INSTALL_BASE="file://$GITHUB_WORKSPACE/installer-fixture"
          fi
          VF_INSTALL_FETCH=0 sh install.sh
          vf version
          test "$(VF_QUIET=1 vf sh -c 'echo "$VOLTA_FOREVER"')" = "$version"
          VF_QUIET=1 vf sh -c 'grep -F "$VOLTA_FOREVER_HOME/lib/libvf_audit.so" "/proc/$$/maps" > /dev/null'
          vf inspect tests/kernels/k_fit_test.135.sm75.cubin > /tmp/vf-inspect.txt
          grep -F 'cubin for sm_75' /tmp/vf-inspect.txt
