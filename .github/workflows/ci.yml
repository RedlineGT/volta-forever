name: ci

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  check:
    # Build the installer test binaries on the oldest distribution in the matrix.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: The layer built as scripts/build.sh installs it
        run: scripts/build.sh
      - name: The proxy against a stand-in for the driver
        run: |
          tests/proxy/fit_api.sh
          tests/proxy/marker.sh
      - name: The launcher, under dash and under bash
        run: |
          dash tests/launcher/launcher.sh
          bash --posix tests/launcher/launcher.sh
      - name: How the PyTorch test programs run their workers, with fake workers
        run: python3 tests/gpu/torch-workers.py
      - name: The installer is a POSIX shell script
        run: |
          dash -n install.sh
          bash --posix -n install.sh
      - name: The Rust translator against the Python reference, on the test kernels
        run: |
          scripts/fetch-all.sh denvdis
          VF_TOOL=dist/bin/vf-translate JOBS=4 tests/sass/compare.sh

      - name: Prepare the installer test archive from this build
        if: github.event_name != 'release'
        run: tests/launcher/installer-fixture.sh "$RUNNER_TEMP/installer-fixture"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: installer-fixture
          path: ${{ runner.temp }}/installer-fixture/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  install:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - name: What a user has before the one-liner
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: github.event_name != 'release'
        with:
          name: installer-fixture
          path: installer-fixture
      - name: Install and run the installed binaries
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
              test "$GITHUB_REF_NAME" = "v$version"
              export VF_INSTALL_BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          else
              export VF_INSTALL_BASE="file://$GITHUB_WORKSPACE/installer-fixture"
          fi
          VF_INSTALL_FETCH=0 sh install.sh
          vf version
          test "$(VF_QUIET=1 vf sh -c 'echo "$VOLTA_FOREVER"')" = "$version"
          VF_QUIET=1 vf sh -c 'grep -F "$VOLTA_FOREVER_HOME/lib/libvf_audit.so" "/proc/$$/maps" > /dev/null'
          vf inspect tests/kernels/k_fit_test.135.sm75.cubin > /tmp/vf-inspect.txt
          grep -F 'cubin for sm_75' /tmp/vf-inspect.txt
